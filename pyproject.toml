[project]
name = "ai-pair-interview-template"
version = "0.1.0"
description = "Reusable Python and SQL pairing-interview environment"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["template_tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

