[project]
name = "sql-customer-revenue-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sql_challenge: tests for the SQL example"]

