[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "python-rate-limiter-example"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/interview_challenge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["python_challenge: tests for the Python example"]

